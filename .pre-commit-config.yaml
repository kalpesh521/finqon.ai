repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: local
    hooks:
      # Fails the commit if a real .env is staged. .env.example is allowed.
      - id: no-env-file
        name: never commit .env
        entry: .env files must not be committed (use .env.example)
        language: fail
        files: (^|/)\.env$
