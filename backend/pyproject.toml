[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "finqon"
version = "0.1.0"
description = "FinQon.ai backend: text-to-SQL chat over bank statements."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.54",
    "sqlglot>=25.30",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.9",
    "tzdata>=2024.2",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
# Seed data generation, eval runner, and tests. Not installed in the API image.
dev = [
    "faker>=30.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
finqon-cli = "finqon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["finqon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a migrated and seeded PostgreSQL (FINQON_* database URLs).",
]

[tool.mypy]
python_version = "3.12"
files = ["finqon"]
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PL"]
ignore = [
    "PLR0913",  # many arguments are normal for dependency-injected services
    "PLR2004",  # magic values in tests and small guards
    "PLR0911",  # early returns read better than nesting in the sniffing helpers
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501"]
"tests/**" = ["PLR0915", "E501"]
# One-off scripts: readability over micro-structure.
"../dataset/*" = ["PLR0911", "PLR0912", "PLR0915", "PLR0917", "PLC0415"]
"../eval/*" = ["PLR0911", "PLR0913", "PLR0917", "BLE001"]
