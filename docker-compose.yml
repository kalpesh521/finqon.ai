# FinQon.ai. PostgreSQL 16 with pgvector runs in this Compose file.
#
#   cp .env.example .env          # JWT, model key, seed password
#   docker compose up -d postgres
#   docker compose --profile setup run --rm setup   # once: roles, migrations, seed
#   docker compose up --build api web               # API :8000, UI :5173
#
# Containers ignore the hostnames in .env and use the `postgres` service.
# Processes on the machine (make setup, uvicorn) use the localhost URLs in .env.
# Both sides share FINQON_POSTGRES_PASSWORD. Local passwords must be URL-safe.

name: finqon

x-db-env: &db-env
  FINQON_ADMIN_DATABASE_URL: postgresql://finqon:${FINQON_POSTGRES_PASSWORD:-finqon_local_dev}@postgres:5432/finqon?sslmode=disable
  FINQON_API_DATABASE_URL: postgresql://finqon_api:${FINQON_POSTGRES_PASSWORD:-finqon_local_dev}@postgres:5432/finqon?sslmode=disable
  FINQON_READER_DATABASE_URL: postgresql://finqon_reader:${FINQON_POSTGRES_PASSWORD:-finqon_local_dev}@postgres:5432/finqon?sslmode=disable
  FINQON_LOADER_DATABASE_URL: postgresql://finqon_loader:${FINQON_POSTGRES_PASSWORD:-finqon_local_dev}@postgres:5432/finqon?sslmode=disable

x-tools: &tools
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: tools
  env_file: .env
  environment:
    <<: *db-env
  working_dir: /app/backend
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finqon
      POSTGRES_PASSWORD: ${FINQON_POSTGRES_PASSWORD:-finqon_local_dev}
      POSTGRES_DB: finqon
    ports:
      # Host 5433, container 5432. 5432 is left for a Postgres already installed on the machine.
      - "${FINQON_POSTGRES_PORT:-5433}:5432"
    volumes:
      - finqon_pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finqon -d finqon"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Semantic cache store. Optional: `docker compose --profile cache up -d redis`, then set
  # FINQON_CACHE_MODE=shadow and FINQON_CACHE_BACKEND=redis in .env (see docs/semantic-cache.md).
  # Redis Stack Server is required: the vector index needs the RediSearch module.
  # The cache is disposable, so there is no volume and no persistence. Memory is capped and
  # the oldest-used keys are evicted first. The API does not wait for this service: if it is
  # down, questions are simply answered by the agent.
  redis:
    image: redis/redis-stack-server:7.4.0-v1
    profiles: ["cache"]
    environment:
      REDIS_ARGS: >-
        --maxmemory ${FINQON_REDIS_MAXMEMORY:-256mb}
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
    ports:
      - "127.0.0.1:${FINQON_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    env_file: .env
    environment:
      <<: *db-env
      # Same rule as the database URLs: inside Compose the host is the service name.
      FINQON_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  # One-off. Safe to run again. Re-running reloads the seed ledger and removes
  # statement uploads that belong to the two seed users.
  setup:
    <<: *tools
    profiles: ["setup"]
    command:
      - sh
      - -c
      - python -m finqon.db.bootstrap_roles && alembic upgrade head && python ../dataset/load_ledger.py

  # One-off: run the evaluation set against the live model and write the report.
  eval:
    <<: *tools
    profiles: ["eval"]
    command: ["python", "../eval/run_eval.py"]
    volumes:
      - ./eval/reports:/app/eval/reports

  # One-off: the full test suite, including tests against the real database.
  test:
    <<: *tools
    profiles: ["test"]
    command: ["pytest", "-q"]

volumes:
  finqon_pgdata:
