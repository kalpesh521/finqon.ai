- id: largest-purchase-last-month
  tag: ranking
  question: What was my single largest expense last month?
  expect: values
  reference_sql: |
    SELECT merchant_name, spend_amount
    FROM reporting.spend
    WHERE txn_date >= date_trunc('month', current_date - interval '1 month')::date
      AND txn_date <  date_trunc('month', current_date)::date
    ORDER BY spend_amount DESC
