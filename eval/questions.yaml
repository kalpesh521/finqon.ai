# Evaluation set for the FinQon agent. Run it with:  python eval/run_eval.py
#
# Every case runs as kalpeshpawar@gmail.com. Answers are judged by VALUES, not SQL text.
#
# Spend (used by every reference_sql below) is defined once, in reporting.spend:
#   spend = debits that are not transfers, minus linked refunds (negative on the refund date).
#   Salary and other credits are not spend. Transfers (rent to parents, etc.) are not spend.
#
# Date windows match backend/finqon/agent/date_ranges.py, evaluated in Asia/Kolkata:
#   last month        the previous full calendar month
#   last 3 months     the three full calendar months before this month
#   last 30 days      today minus 29 days through today, inclusive
#   this quarter      quarter start through today (quarters start Apr, Jul, Oct, Jan)
#   financial year    1 April to 31 March
#
# Fields
#   expect      values | clarification | refusal | smalltalk | privacy
#   compare     rows (default, same row count) | superset (agent may add rows) | numbers (any shape)
#   ordered     true when the question asks for a ranking
#   prior       the turn a follow-up continues; stored as real history before the question is asked
#   must_not_match  regexes the reply must not contain
#   must_match      regexes the reply must contain (facts it is required to state)
#   rubric          criteria for the LLM judge; use only where code cannot decide
#   expect also allows smalltalk (a reply, no SQL, no table) and privacy (the message holds
#   sensitive data: a polite notice, no SQL, nothing stored)
#
# Never edit a case to make it pass. Fix the views, date preamble, or few-shot pairs instead.

# ----------------------------------------------------------------------------- the six brief questions

- id: dining-last-month
  tag: aggregation
  question: How much did I spend on eating out last month?
  expect: values
  reference_sql: |
    SELECT COALESCE(SUM(spend_amount), 0) AS total
    FROM reporting.spend
    WHERE category_name = 'Dining'
      AND txn_date >= date_trunc('month', current_date - interval '1 month')::date
      AND txn_date <  date_trunc('month', current_date)::date

- id: category-breakdown-3-months
  tag: aggregation
  question: Give me a category-wise spending breakdown for the last 3 months.
  expect: values
  reference_sql: |
    SELECT category_name, SUM(spend_amount) AS total
    FROM reporting.spend
    WHERE txn_date >= date_trunc('month', current_date - interval '3 months')::date
      AND txn_date <  date_trunc('month', current_date)::date
    GROUP BY category_name
    HAVING SUM(spend_amount) <> 0
    ORDER BY total DESC

- id: top-5-merchants
  tag: ranking
  question: What are my top 5 merchants by spend?
  expect: values
  ordered: true
  note: Unknown Merchant is a cleaning placeholder, not a merchant, so it is excluded from rankings.
  reference_sql: |
    SELECT merchant_name, SUM(spend_amount) AS total
    FROM reporting.spend
    WHERE merchant_name <> 'Unknown Merchant'
    GROUP BY merchant_name
    ORDER BY total DESC, merchant_name
    LIMIT 5

- id: highest-spend-month-and-why
  tag: ranking
  question: Which month did I spend the most, and why?
  expect: values
  compare: superset
  note: The agent may show more categories than the three biggest drivers, but must include them.
  rubric:
    - The reply names the month with the highest spend.
    - The reply explains the drivers using categories that appear in the result table.
    - The reply does not claim a cause (a festival, a trip) that the table does not show.
  reference_sql: |
    WITH top_month AS (
        SELECT month FROM reporting.monthly_category_spend
        GROUP BY month ORDER BY SUM(spend) DESC LIMIT 1
    )
    SELECT c.category_name, c.spend
    FROM reporting.monthly_category_spend c
    JOIN top_month t ON t.month = c.month
    ORDER BY c.spend DESC
    LIMIT 3

- id: transactions-above-5000-last-30-days
  tag: date
  question: Show me all transactions above ₹5,000 in the last 30 days.
  expect: values
  note: Literal reading - every transaction, money in or out, above 5,000.
  reference_sql: |
    SELECT txn_date, merchant_name, amount
    FROM reporting.transactions
    WHERE amount > 5000
      AND txn_date BETWEEN current_date - 29 AND current_date
    ORDER BY txn_date DESC, amount DESC

- id: grocery-quarter-comparison
  tag: comparison
  question: Compare my grocery spend this quarter vs last quarter.
  expect: values
  compare: numbers
  note: This quarter is quarter-to-date, so the two figures are not like for like; the reply should say so.
  must_match:
    - 'quarter.to.date|so far|to date|incomplete|partial|not like'
  reference_sql: |
    SELECT
      SUM(spend_amount) FILTER (
        WHERE txn_date >= date_trunc('quarter', current_date)::date) AS this_quarter,
      SUM(spend_amount) FILTER (
        WHERE txn_date <  date_trunc('quarter', current_date)::date) AS last_quarter
    FROM reporting.spend
    WHERE category_name = 'Groceries'
      AND txn_date >= (date_trunc('quarter', current_date) - interval '3 months')::date

# ----------------------------------------------------------------------------- follow-ups

- id: follow-up-month-before
  tag: follow-up
  question: What about the month before?
  expect: values
  prior:
    question: How much did I spend on eating out last month?
    sql: |
      SELECT COALESCE(SUM(spend_amount), 0) AS total_spend
      FROM reporting.spend
      WHERE category_name = 'Dining'
        AND txn_date >= date_trunc('month', current_date - interval '1 month')::date
        AND txn_date <  date_trunc('month', current_date)::date
    summary: "1 row, column total_spend (dining spend for last month)"
    answer: Here is your dining spend for last month.
  reference_sql: |
    SELECT COALESCE(SUM(spend_amount), 0) AS total
    FROM reporting.spend
    WHERE category_name = 'Dining'
      AND txn_date >= date_trunc('month', current_date - interval '2 months')::date
      AND txn_date <  date_trunc('month', current_date - interval '1 month')::date

- id: follow-up-break-down-by-merchant
  tag: follow-up
  question: Break that down by merchant
  expect: values
  prior:
    question: How much did I spend on eating out last month?
    sql: |
      SELECT COALESCE(SUM(spend_amount), 0) AS total_spend
      FROM reporting.spend
      WHERE category_name = 'Dining'
        AND txn_date >= date_trunc('month', current_date - interval '1 month')::date
        AND txn_date <  date_trunc('month', current_date)::date
    summary: "1 row, column total_spend (dining spend for last month)"
    answer: Here is your dining spend for last month.
  reference_sql: |
    SELECT merchant_name, SUM(spend_amount) AS total
    FROM reporting.spend
    WHERE category_name = 'Dining'
      AND txn_date >= date_trunc('month', current_date - interval '1 month')::date
      AND txn_date <  date_trunc('month', current_date)::date
    GROUP BY merchant_name
    HAVING SUM(spend_amount) <> 0
    ORDER BY total DESC

- id: follow-up-only-top-3
  tag: follow-up
  question: Only show the top 3.
  expect: values
  ordered: true
  prior:
    question: What are my top 5 merchants by spend?
    sql: |
      SELECT merchant_name, SUM(spend_amount) AS total_spend
      FROM reporting.spend
      WHERE merchant_name <> 'Unknown Merchant'
      GROUP BY merchant_name
      ORDER BY total_spend DESC, merchant_name, merchant_name
      LIMIT 5
    summary: "5 rows, columns merchant_name, total_spend (top merchants by net spend)"
    answer: Here are your top five merchants by spend.
  reference_sql: |
    SELECT merchant_name, SUM(spend_amount) AS total
    FROM reporting.spend
    WHERE merchant_name <> 'Unknown Merchant'
    GROUP BY merchant_name
    ORDER BY total DESC
    LIMIT 3

# ----------------------------------------------------------------------------- dates and aggregation

- id: spend-last-30-days
